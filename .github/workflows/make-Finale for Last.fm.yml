name: Build Finale (Scrobbler Only)

on:
  workflow_dispatch: # 支持手动点击运行

permissions:
  contents: write

jobs:
  build-finale:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout current repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Clone source code to temp dir
        run: |
          cd ${{ runner.temp }}
          git clone https://github.com/nrubin29/finale.git finale-src
          cd finale-src
          git fetch --tags
          git checkout v5.1.3+53

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: 'stable'

      - name: Build APK with Last.fm Keys
        run: |
          cd ${{ runner.temp }}/finale-src
          
          # 1. 生成 env.dart 并注入密钥
          cp lib/env_sample.dart lib/env.dart
          sed -i "s|^const apiKey = .*|const apiKey = '${{ secrets.LASTFM_API_KEY }}';|g" lib/env.dart
          sed -i "s|^const apiSecret = .*|const apiSecret = '${{ secrets.LASTFM_API_SECRET }}';|g" lib/env.dart
          
          # 2. 【修复签名报错】动态生成 keystore 和 key.properties
          echo "生成临时签名文件..."
          keytool -genkey -v -keystore ${{ runner.temp }}/release.jks -keyalg RSA -keysize 2048 -validity 10000 -alias upload -storepass 123456 -keypass 123456 -dname "CN=Android Debug,O=Android,C=US"
          
          cat > android/key.properties <<EOF
          storePassword=123456
          keyPassword=123456
          keyAlias=upload
          storeFile=${{ runner.temp }}/release.jks
          EOF
          
          # 3. 编译
          flutter pub get
          flutter pub run build_runner build
          flutter build apk --release

      - name: Copy and Rename APK
        run: |
          cd ${{ runner.temp }}/finale-src
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | tr -d ' ')
          cp build/app/outputs/flutter-apk/app-release.apk ${{ github.workspace }}/Finale-${VERSION}-Scrobbler.apk
          echo "APP_VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Commit and push APK
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true

          git add "Finale-*.apk"
          if git diff --cached --quiet; then
            echo "APK 无变化，跳过提交"
          else
            git commit -m "Auto-build: Finale-${{ env.APP_VERSION }}-Scrobbler.apk (build ${GITHUB_RUN_NUMBER})"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi