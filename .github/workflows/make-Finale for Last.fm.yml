name: Build & Push Finale APK

on:
  push:
    tags:
      - 'v*'          # 推送版本标签时触发（如 v5.1.3+53）
  workflow_dispatch:   # 支持手动触发

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      # 1. 克隆源码
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. 设置 Flutter 环境
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'   # 与 pubspec.yaml 中的要求一致[reference:0]
          channel: 'stable'

      # 3. 安装依赖
      - name: Install dependencies
        run: flutter pub get

      # 4. 运行代码生成（build_runner）
      - name: Run build_runner
        run: flutter pub run build_runner build --delete-conflicting-outputs

      # 5. 编译 APK（release）
      - name: Build APK
        run: flutter build apk --release

      # 6. 按命名格式重命名 APK
      - name: Rename APK
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | tr -d ' ')
          mv build/app/outputs/flutter-apk/app-release.apk \
             "Finale-${VERSION}-Flutter.apk"

      # 7. 提交并推送 APK 到仓库
      - name: Commit and push APK
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "Finale-*.apk"
          git commit -m "Add APK build: Finale-${VERSION}-Flutter.apk"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}