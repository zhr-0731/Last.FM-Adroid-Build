name: Build Last.FM APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout current repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Clone GitCode repository
        run: |
          git clone https://gitcode.com/zhr-0731/Last.FM.git /tmp/source
          ls -la /tmp/source/

      - name: Extract archive
        run: |
          cd /tmp/source
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -1)
          if [ -z "$ZIP_FILE" ]; then
            echo "No zip found"
            ls -la
            exit 1
          fi
          echo "Found: $ZIP_FILE"
          7z x "$ZIP_FILE" -aoa
          ls -la

      - name: Detect build system
        run: |
          cd /tmp/source
          GRADLEW=$(find . -maxdepth 5 -name gradlew -type f -not -path './.git*' 2>/dev/null | sed -n '1p')
          BUILD_XML=$(find . -maxdepth 5 -name build.xml -type f -not -path './.git*' 2>/dev/null | sed -n '1p')

          echo "GRADLEW=$GRADLEW"
          echo "BUILD_XML=$BUILD_XML"

          if [ -n "$GRADLEW" ]; then
            BUILD_DIR_ABS=$(cd "$(dirname "$GRADLEW")" && pwd)
            BUILD_SYSTEM=gradle
          elif [ -n "$BUILD_XML" ]; then
            BUILD_DIR_ABS=$(cd "$(dirname "$BUILD_XML")" && pwd)
            BUILD_SYSTEM=ant
          else
            echo "::error::无法识别构建系统"
            exit 1
          fi

          echo "BUILD_DIR_ABS=$BUILD_DIR_ABS"
          echo "BUILD_SYSTEM=$BUILD_SYSTEM"
          echo "BUILD_DIR_ABS=$BUILD_DIR_ABS" >> $GITHUB_ENV
          echo "BUILD_SYSTEM=$BUILD_SYSTEM"   >> $GITHUB_ENV

          echo "=== 构建目录内容 ==="
          ls -la "$BUILD_DIR_ABS"
          echo "=== 主工程 project.properties ==="
          cat "$BUILD_DIR_ABS/project.properties" 2>/dev/null || echo "(无)"

          echo "=== 全盘搜索 library 目录 ==="
          find /tmp/source -maxdepth 4 -type d -name library -not -path '*/.git*' 2>/dev/null || true

      # ── Gradle 路径（保留兼容） ──
      - name: Set up JDK 17 (Gradle)
        if: env.BUILD_SYSTEM == 'gradle'
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        if: env.BUILD_SYSTEM == 'gradle'
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK with Gradle
        if: env.BUILD_SYSTEM == 'gradle'
        working-directory: ${{ env.BUILD_DIR_ABS }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      # ── Ant 路径 ──
      - name: Set up JDK 8 (Ant)
        if: env.BUILD_SYSTEM == 'ant'
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '8'

      - name: Install legacy Android SDK Tools 25.2.5
        if: env.BUILD_SYSTEM == 'ant'
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "SDK_ROOT=$SDK_ROOT"
          cd "$SDK_ROOT"

          if [ -d tools ]; then
            mv tools "tools_backup_$(date +%s)"
          fi

          wget -q https://dl.google.com/android/repository/tools_r25.2.5-linux.zip -O /tmp/tools.zip
          unzip -q -o /tmp/tools.zip -d "$SDK_ROOT"

          echo "=== 验证 ant/build.xml ==="
          ls -la "$SDK_ROOT/tools/ant/build.xml"

      - name: Prepare Ant environment
        if: env.BUILD_SYSTEM == 'ant'
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "SDK_ROOT=$SDK_ROOT"
          echo "BUILD_DIR_ABS=$BUILD_DIR_ABS"

          sudo apt-get update -qq
          sudo apt-get install -y ant

          # ── 解析 library 依赖（绝对路径） ──
          LIB_REF=$(grep -E '^android.library.reference.1=' "$BUILD_DIR_ABS/project.properties" \
                    | cut -d= -f2 | tr -d '\r' || true)
          echo "LIB_REF=$LIB_REF"

          if [ -n "$LIB_REF" ]; then
            LIB_DIR_RAW="$BUILD_DIR_ABS/$LIB_REF"
            if [ -d "$LIB_DIR_RAW" ]; then
              LIB_DIR=$(cd "$LIB_DIR_RAW" && pwd)
              echo "LIB_DIR=$LIB_DIR"
              echo "LIB_DIR=$LIB_DIR" >> $GITHUB_ENV
              echo "sdk.dir=$SDK_ROOT" > "$LIB_DIR/local.properties"
              echo "=== library project.properties ==="
              cat "$LIB_DIR/project.properties" 2>/dev/null || true
            else
              echo "::warning::Library 未找到：$LIB_DIR_RAW"
            fi
          fi

          # ── 主工程 local.properties ──
          echo "sdk.dir=$SDK_ROOT" > "$BUILD_DIR_ABS/local.properties"

          # ── 批量安装旧平台（含 library 需要的 android-15） ──
          install_platform() {
            local API=$1 ZIPFILE=$2
            local DEST="$SDK_ROOT/platforms/android-${API}"
            if [ -d "$DEST" ]; then
              echo "android-${API} 已安装"
              return 0
            fi
            echo ">>> 安装 android-${API}"
            wget -q "https://dl.google.com/android/repository/${ZIPFILE}" -O /tmp/p.zip || {
              echo "::warning::下载 android-${API} 失败"
              return 1
            }
            rm -rf /tmp/p_tmp
            mkdir -p /tmp/p_tmp
            unzip -q -o /tmp/p.zip -d /tmp/p_tmp
            local FIRST
            FIRST=$(find /tmp/p_tmp -mindepth 1 -maxdepth 1 -type d | sed -n '1p')
            if [ -z "$FIRST" ]; then
              echo "::warning::android-${API} 解压后无目录"
              return 1
            fi
            mkdir -p "$SDK_ROOT/platforms"
            mv "$FIRST" "$DEST"
            if [ -f "$DEST/android.jar" ]; then
              echo "OK android-${API}: $DEST"
            else
              echo "::warning::android-${API} 缺 android.jar"
            fi
          }

          install_platform 15 android-15_r05.zip
          install_platform 16 android-16_r05.zip
          install_platform 17 android-17_r03.zip
          install_platform 18 android-18_r03.zip
          install_platform 19 android-19_r04.zip

          # ── 手动安装 build-tools;19.1.0 ──
          if [ ! -d "$SDK_ROOT/build-tools/19.1.0" ]; then
            echo ">>> 安装 build-tools 19.1.0"
            rm -rf /tmp/bt191_tmp
            wget -q https://dl.google.com/android/repository/build-tools_r19.1-linux.zip -O /tmp/bt191.zip
            mkdir -p /tmp/bt191_tmp
            unzip -q -o /tmp/bt191.zip -d /tmp/bt191_tmp
            FIRST=$(find /tmp/bt191_tmp -mindepth 1 -maxdepth 1 -type d | sed -n '1p')
            mv "$FIRST" "$SDK_ROOT/build-tools/19.1.0"
          fi
          echo "=== build-tools/19.1.0 内容 ==="
          ls "$SDK_ROOT/build-tools/19.1.0" | sed -n '1,40p'

          echo "=== 已安装的平台 ==="
          ls "$SDK_ROOT/platforms"
          echo "=== 已安装的 build-tools ==="
          ls "$SDK_ROOT/build-tools"

      - name: Build APK with Ant
        if: env.BUILD_SYSTEM == 'ant'
        working-directory: ${{ env.BUILD_DIR_ABS }}
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          export PATH="$SDK_ROOT/tools:$SDK_ROOT/platform-tools:$PATH"

          echo "=== android 命令 ==="
          which android || echo "android not in PATH"

          echo "=== ant release -Dsdk.buildtools=19.1.0 ==="
          ant release -Dsdk.buildtools=19.1.0 || {
            echo "=== release 失败，尝试 debug ==="
            ant debug -Dsdk.buildtools=19.1.0
          }

          echo "=== bin/ 内容 ==="
          ls -la bin/ || true

      # ── 定位 APK ──
      - name: Locate built APK
        run: |
          APK_PATH=$(find "$BUILD_DIR_ABS" -name "*.apk" -type f 2>/dev/null | grep -i release | sed -n '1p')
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find "$BUILD_DIR_ABS" -name "*.apk" -type f 2>/dev/null | sed -n '1p')
          fi

          if [ -z "$APK_PATH" ]; then
            echo "::error::未找到任何 APK"
            find "$BUILD_DIR_ABS" -name "*.apk" 2>/dev/null || true
            exit 1
          fi

          echo "Found APK: $APK_PATH"
          cp "$APK_PATH" "$GITHUB_WORKSPACE/lastfm-release.apk"
          ls -lh "$GITHUB_WORKSPACE/lastfm-release.apk"

      # ── 上传到仓库 ──
      - name: Commit and push APK to repository
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git pull --rebase origin "${GITHUB_REF_NAME}"

          git add lastfm-release.apk
          if git diff --cached --quiet; then
            echo "APK 无变化，跳过提交"
          else
            git commit -m "chore: update APK (build ${GITHUB_RUN_NUMBER})"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      # ── 上传到 Release ──
      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag'
        with:
          files: lastfm-release.apk
          name: "Last.FM APK ${{ github.ref_name }}"
          body: |
            自动构建的 Last.FM Android APK
            版本: ${{ github.ref_name }}
            提交: ${{ github.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
