name: Build Last.FM APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write     # 提交回仓库 + 上传 Release 都需要写权限

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ── 先检出当前 GitHub 仓库（用于后面提交 APK） ──
      - name: Checkout current repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # 需要完整历史，便于 pull
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── 第一步：克隆 GitCode 仓库到临时目录 ──
      - name: Clone GitCode repository
        run: |
          git clone https://gitcode.com/zhr-0731/Last.FM.git /tmp/source
          ls -la /tmp/source/

      # ── 第二步：解压压缩包 ──
      - name: Extract archive
        run: |
          cd /tmp/source
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Found: $ZIP_FILE"
            7z x "$ZIP_FILE" -aoa
          else
            echo "No .zip found, listing:"
            ls -R
            exit 1
          fi
          ls -la

      # ── 第三步：定位 Android 源码目录 ──
      - name: Locate Android source
        run: |
          cd /tmp/source
          APP_DIR=$(find . -maxdepth 3 -type d -name "lastfm-android-RELEASE*" | head -1)
          echo "Found Android dir: $APP_DIR"
          echo "APP_DIR=$APP_DIR" >> $GITHUB_ENV

      # ── 第四步：编译 APK ──
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: chmod +x /tmp/source/${{ env.APP_DIR }}/gradlew

      - name: Build Release APK
        working-directory: /tmp/source/${{ env.APP_DIR }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Locate built APK
        run: |
          cd /tmp/source
          APK_PATH=$(find "$APP_DIR" -name "*.apk" -path "*release*" | head -1)
          echo "Found APK: $APK_PATH"
          # 复制到当前仓库工作区，重命名后入库
          cp "$APK_PATH" "$GITHUB_WORKSPACE/lastfm-release.apk"
          ls -lh "$GITHUB_WORKSPACE/lastfm-release.apk"

      # ── 第五步 A：上传到仓库（git pull + commit + push） ──
      - name: Commit and push APK to repository
        run: |
          cd "$GITHUB_WORKSPACE"

          # 配置 git 身份
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 先拉取远端最新，避免推送被拒
          git pull --rebase origin "${GITHUB_REF_NAME}"

          # 暂存并提交 APK
          git add lastfm-release.apk
          if git diff --cached --quiet; then
            echo "APK 无变化，跳过提交"
          else
            git commit -m "chore: update APK (build ${GITHUB_RUN_NUMBER})"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      # ── 第五步 B：上传到 Release ──
      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag'
        with:
          files: lastfm-release.apk
          name: "Last.FM APK ${{ github.ref_name }}"
          body: |
            自动构建的 Last.FM Android APK
            版本: ${{ github.ref_name }}
            提交: ${{ github.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
