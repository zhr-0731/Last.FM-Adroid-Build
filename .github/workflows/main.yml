name: Build Last.FM APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout current repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Clone GitCode repository
        run: |
          git clone https://gitcode.com/zhr-0731/Last.FM.git /tmp/source
          ls -la /tmp/source/

      - name: Extract archive
        run: |
          cd /tmp/source
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -1)
          if [ -z "$ZIP_FILE" ]; then
            echo "No zip found"
            ls -la
            exit 1
          fi
          echo "Found: $ZIP_FILE"
          7z x "$ZIP_FILE" -aoa
          ls -la

      # ── 探测构建系统（避免 SIGPIPE，改用 sed -n） ──
      - name: Detect build system
        run: |
          cd /tmp/source

          GRADLEW=$(find . -maxdepth 5 -name gradlew -type f -not -path './.git*' 2>/dev/null | sed -n '1p')
          BUILD_XML=$(find . -maxdepth 5 -name build.xml -type f -not -path './.git*' 2>/dev/null | sed -n '1p')

          echo "GRADLEW=$GRADLEW"
          echo "BUILD_XML=$BUILD_XML"

          if [ -n "$GRADLEW" ]; then
            BUILD_DIR=$(dirname "$GRADLEW")
            BUILD_SYSTEM=gradle
          elif [ -n "$BUILD_XML" ]; then
            BUILD_DIR=$(dirname "$BUILD_XML")
            BUILD_SYSTEM=ant
          else
            echo "::error::无法识别构建系统（既没有 gradlew 也没有 build.xml）"
            ls -la
            exit 1
          fi

          echo "BUILD_DIR=$BUILD_DIR"
          echo "BUILD_SYSTEM=$BUILD_SYSTEM"
          echo "BUILD_DIR=$BUILD_DIR"       >> $GITHUB_ENV
          echo "BUILD_SYSTEM=$BUILD_SYSTEM" >> $GITHUB_ENV

          echo "=== 构建目录内容 ==="
          ls -la "$BUILD_DIR"
          echo "=== project.properties ==="
          cat "$BUILD_DIR/project.properties" 2>/dev/null || echo "(无)"

      # ── Gradle 路径 ──
      - name: Set up JDK 17 (Gradle)
        if: env.BUILD_SYSTEM == 'gradle'
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        if: env.BUILD_SYSTEM == 'gradle'
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK with Gradle
        if: env.BUILD_SYSTEM == 'gradle'
        working-directory: /tmp/source/${{ env.BUILD_DIR }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      # ── Ant 路径（2014 年老项目） ──
      - name: Set up JDK 8 (Ant)
        if: env.BUILD_SYSTEM == 'ant'
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '8'

      - name: Prepare Ant environment
        if: env.BUILD_SYSTEM == 'ant'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ant

          cd /tmp/source/${{ env.BUILD_DIR }}

          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "=== local.properties ==="
          cat local.properties

          echo "=== project.properties ==="
          cat project.properties || true

          # 从 project.properties 提取 target（例如 android-19），安装对应平台
          TARGET=$(grep -E '^target=' project.properties | cut -d= -f2 | tr -d '\r' || true)
          echo "TARGET=$TARGET"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ] && [ -n "$TARGET" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;$TARGET"        || true
            "$SDKMANAGER" "build-tools;19.1.0"       || true
            "$SDKMANAGER" "platform-tools"           || true
          fi

      - name: Build APK with Ant
        if: env.BUILD_SYSTEM == 'ant'
        working-directory: /tmp/source/${{ env.BUILD_DIR }}
        run: |
          echo "=== 尝试 ant release ==="
          ant release || {
            echo "=== release 失败，尝试 ant debug ==="
            ant debug
          }
          echo "=== bin/ 内容 ==="
          ls -la bin/ || true

      # ── 统一：定位 APK ──
      - name: Locate built APK
        run: |
          cd /tmp/source

          # 优先 release，其次任意 apk
          APK_PATH=$(find "${{ env.BUILD_DIR }}" -name "*.apk" -type f 2>/dev/null | grep -i release | sed -n '1p')
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find "${{ env.BUILD_DIR }}" -name "*.apk" -type f 2>/dev/null | sed -n '1p')
          fi

          if [ -z "$APK_PATH" ]; then
            echo "::error::未找到任何 APK"
            find "${{ env.BUILD_DIR }}" -name "*.apk" 2>/dev/null || true
            exit 1
          fi

          echo "Found APK: $APK_PATH"
          cp "$APK_PATH" "$GITHUB_WORKSPACE/lastfm-release.apk"
          ls -lh "$GITHUB_WORKSPACE/lastfm-release.apk"

      # ── 上传到仓库（git pull → commit → push） ──
      - name: Commit and push APK to repository
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git pull --rebase origin "${GITHUB_REF_NAME}"

          git add lastfm-release.apk
          if git diff --cached --quiet; then
            echo "APK 无变化，跳过提交"
          else
            git commit -m "chore: update APK (build ${GITHUB_RUN_NUMBER})"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      # ── 上传到 Release ──
      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag'
        with:
          files: lastfm-release.apk
          name: "Last.FM APK ${{ github.ref_name }}"
          body: |
            自动构建的 Last.FM Android APK
            版本: ${{ github.ref_name }}
            提交: ${{ github.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
