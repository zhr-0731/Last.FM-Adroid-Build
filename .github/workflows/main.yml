name: Build Last.FM APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ── 先检出当前 GitHub 仓库（用于后面提交 APK） ──
      - name: Checkout current repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── 第一步：克隆 GitCode 仓库 ──
      - name: Clone GitCode repository
        run: |
          git clone https://gitcode.com/zhr-0731/Last.FM.git /tmp/source
          ls -la /tmp/source/

      # ── 第二步：解压压缩包 ──
      - name: Extract archive
        run: |
          cd /tmp/source
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -1)
          if [ -z "$ZIP_FILE" ]; then
            echo "No zip found"
            ls -la
            exit 1
          fi
          echo "Found: $ZIP_FILE"
          7z x "$ZIP_FILE" -aoa
          ls -la

      # ── 第三步：定位 Android 源码目录与构建系统 ──
      - name: Detect build system
        run: |
          cd /tmp/source

          GRADLEW=$(find . -maxdepth 5 -name gradlew -type f -not -path './.git*' 2>/dev/null | sed -n '1p')
          BUILD_XML=$(find . -maxdepth 5 -name build.xml -type f -not -path './.git*' 2>/dev/null | sed -n '1p')

          echo "GRADLEW=$GRADLEW"
          echo "BUILD_XML=$BUILD_XML"

          if [ -n "$GRADLEW" ]; then
            BUILD_DIR=$(dirname "$GRADLEW")
            BUILD_SYSTEM=gradle
          elif [ -n "$BUILD_XML" ]; then
            BUILD_DIR=$(dirname "$BUILD_XML")
            BUILD_SYSTEM=ant
          else
            echo "::error::无法识别构建系统（既无 gradlew 也无 build.xml）"
            ls -la
            exit 1
          fi

          echo "BUILD_DIR=$BUILD_DIR"
          echo "BUILD_SYSTEM=$BUILD_SYSTEM"
          echo "BUILD_DIR=$BUILD_DIR"       >> $GITHUB_ENV
          echo "BUILD_SYSTEM=$BUILD_SYSTEM" >> $GITHUB_ENV

          echo "=== 构建目录内容 ==="
          ls -la "$BUILD_DIR"
          echo "=== project.properties ==="
          cat "$BUILD_DIR/project.properties" 2>/dev/null || echo "(无)"

          echo "=== 全盘搜索可能存在的 library 目录 ==="
          find . -maxdepth 4 -type d -name library -not -path './.git*' 2>/dev/null || true

      # ═══════════════════════════════════════════
      #  Gradle 路径（保留兼容）
      # ═══════════════════════════════════════════
      - name: Set up JDK 17 (Gradle)
        if: env.BUILD_SYSTEM == 'gradle'
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        if: env.BUILD_SYSTEM == 'gradle'
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK with Gradle
        if: env.BUILD_SYSTEM == 'gradle'
        working-directory: /tmp/source/${{ env.BUILD_DIR }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      # ═══════════════════════════════════════════
      #  Ant 路径（本项目实际使用）
      # ═══════════════════════════════════════════
      - name: Set up JDK 8 (Ant)
        if: env.BUILD_SYSTEM == 'ant'
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '8'

      - name: Install legacy Android SDK Tools 25.2.5
        if: env.BUILD_SYSTEM == 'ant'
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "SDK_ROOT=$SDK_ROOT"
          cd "$SDK_ROOT"

          echo "=== 当前 SDK 根目录内容 ==="
          ls -la

          if [ -d tools ]; then
            echo "=== 备份已有 tools ==="
            mv tools tools_backup_$(date +%s)
          fi

          echo "=== 下载旧版 SDK Tools 25.2.5 ==="
          wget -q https://dl.google.com/android/repository/tools_r25.2.5-linux.zip \
               -O /tmp/tools_r25.2.5-linux.zip

          echo "=== 解压到 SDK 根目录 ==="
          unzip -q -o /tmp/tools_r25.2.5-linux.zip -d "$SDK_ROOT"

          echo "=== 验证 ant/build.xml ==="
          ls -la "$SDK_ROOT/tools/ant/build.xml"

      - name: Prepare Ant environment
        if: env.BUILD_SYSTEM == 'ant'
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "SDK_ROOT=$SDK_ROOT"

          sudo apt-get update -qq
          sudo apt-get install -y ant

          cd /tmp/source/${{ env.BUILD_DIR }}

          echo "sdk.dir=$SDK_ROOT" > local.properties
          echo "=== local.properties ==="
          cat local.properties

          echo "=== project.properties ==="
          cat project.properties || true

          TARGET=$(grep -E '^target=' project.properties | cut -d= -f2 | tr -d '\r' || true)
          echo "TARGET=$TARGET"

          # ── 处理 library 依赖（可选，找不到不报错） ──
          PROJECT_ROOT=$(dirname "${{ env.BUILD_DIR }}")
          echo "PROJECT_ROOT=$PROJECT_ROOT"

          LIB_REF=$(grep -E '^android.library.reference.1=' project.properties | cut -d= -f2 | tr -d '\r' || true)
          echo "LIB_REF=$LIB_REF"

          if [ -n "$LIB_REF" ]; then
            LIB_DIR_RAW="$PROJECT_ROOT/$LIB_REF"
            if [ -d "$LIB_DIR_RAW" ]; then
              LIB_DIR=$(cd "$LIB_DIR_RAW" && pwd)
              echo "LIB_DIR=$LIB_DIR"
              echo "LIB_DIR=$LIB_DIR" >> $GITHUB_ENV
              ls -la "$LIB_DIR" | sed -n '1,20p'
            else
              echo "::warning::Library '$LIB_REF' 不存在（解析为 $LIB_DIR_RAW），跳过 library 构建"
              echo "=== 同级目录列表（找找 library 是否被改名或缺失） ==="
              ls -la "$PROJECT_ROOT" | sed -n '1,40p'
            fi
          fi

          # ── 安装目标平台和 build-tools ──
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$SDK_ROOT" -name sdkmanager -type f 2>/dev/null | sed -n '1p')
          fi
          echo "SDKMANAGER=$SDKMANAGER"

          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            if [ -n "$TARGET" ]; then
              "$SDKMANAGER" "platforms;$TARGET" || true
            fi
            "$SDKMANAGER" "build-tools;19.1.0" || true
            "$SDKMANAGER" "platform-tools"     || true
          fi

          echo "=== 已安装的平台 ==="
          ls -la "$SDK_ROOT/platforms" 2>/dev/null || true
          echo "=== 已安装的 build-tools ==="
          ls -la "$SDK_ROOT/build-tools" 2>/dev/null || true

      - name: Build APK with Ant
        if: env.BUILD_SYSTEM == 'ant'
        working-directory: /tmp/source/${{ env.BUILD_DIR }}
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          export PATH="$SDK_ROOT/tools:$SDK_ROOT/platform-tools:$PATH"

          echo "=== 验证 android 命令 ==="
          which android || echo "android not in PATH"

          # 如果 library 存在，先构建它
          if [ -n "$LIB_DIR" ] && [ -d "$LIB_DIR" ]; then
            echo "=== 构建 library: $LIB_DIR ==="
            cd "$LIB_DIR"
            echo "sdk.dir=$SDK_ROOT" > local.properties
            cat project.properties || true
            ant release || ant debug || true
            cd -
          else
            echo "=== library 不存在或未解析，跳过 ==="
          fi

          echo "=== 尝试 ant release ==="
          ant release || {
            echo "=== release 失败，尝试 ant debug ==="
            ant debug
          }
          echo "=== bin/ 内容 ==="
          ls -la bin/ || true

      # ═══════════════════════════════════════════
      #  第四步（续）：定位 APK
      # ═══════════════════════════════════════════
      - name: Locate built APK
        run: |
          cd /tmp/source

          APK_PATH=$(find "${{ env.BUILD_DIR }}" -name "*.apk" -type f 2>/dev/null | grep -i release | sed -n '1p')
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find "${{ env.BUILD_DIR }}" -name "*.apk" -type f 2>/dev/null | sed -n '1p')
          fi

          if [ -z "$APK_PATH" ]; then
            echo "::error::未找到任何 APK"
            find "${{ env.BUILD_DIR }}" -name "*.apk" 2>/dev/null || true
            exit 1
          fi

          echo "Found APK: $APK_PATH"
          cp "$APK_PATH" "$GITHUB_WORKSPACE/lastfm-release.apk"
          ls -lh "$GITHUB_WORKSPACE/lastfm-release.apk"

      # ═══════════════════════════════════════════
      #  第五步 A：上传到仓库（git pull → commit → push）
      # ═══════════════════════════════════════════
      - name: Commit and push APK to repository
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git pull --rebase origin "${GITHUB_REF_NAME}"

          git add lastfm-release.apk
          if git diff --cached --quiet; then
            echo "APK 无变化，跳过提交"
          else
            git commit -m "chore: update APK (build ${GITHUB_RUN_NUMBER})"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      # ═══════════════════════════════════════════
      #  第五步 B：上传到发行版（Release）
      # ═══════════════════════════════════════════
      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag'
        with:
          files: lastfm-release.apk
          name: "Last.FM APK ${{ github.ref_name }}"
          body: |
            自动构建的 Last.FM Android APK
            版本: ${{ github.ref_name }}
            提交: ${{ github.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
